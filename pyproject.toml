[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-transfer"
version = "0.1.0"
description = "跨 Agent 任务记忆迁移工具：把 Codex / Claude Code / Cursor / WorkBuddy 的会话任务状态归一化为 Canonical Memory，并注入目标 Agent 自动接续任务。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    "PyYAML>=6.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
amt = "amt.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
